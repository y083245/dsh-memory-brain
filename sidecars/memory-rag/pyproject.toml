[project]
name = "memory-rag"
version = "0.1.0"
description = "qq-bridge 向量记忆索引服务：聊天存档 → 话题切块 → Chroma + FTS5 混合检索"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "fastapi",
    "uvicorn[standard]",
    "jieba",
    "numpy",
    "httpx",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

# 顶层同时有 eval/ 与 memory_rag/，setuptools 的自动发现会拒绝 flat-layout；
# 显式声明要安装的包（Windows / 新版 setuptools 上 `uv pip install -e .` 会直接失败）。
[tool.setuptools.packages.find]
include = ["memory_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
