name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # e2e / probe（真实 DSH、QQ、SnowLuma、浏览器）不在这里跑；见 scripts/test-unit.mjs 的排除表。
      - run: npm test
